[project]
name = "openmarker"
version = "0.1.0"
description = "Open, local-first companion for e-ink paper tablets"
requires-python = ">=3.12"
dependencies = ["rmscene>=0.8"]

[project.scripts]
openmarker = "openmarker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openmarker"]

[tool.setuptools.package-data]
openmarker = ["ui.html"]
