<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openmarker</title>
<style>
  :root {
    --paper: #f3f0e8; --surface: #fbfaf6; --ink: #1d1c1a; --muted: #6f6a60;
    --line: #dcd6c8; --accent: #b4472e; --accent-ink: #fff; --ok: #3d7a4e; --page: #fdfcf9;
    --shadow: 0 1px 2px rgba(40,30,10,.08), 0 6px 18px rgba(40,30,10,.07);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #191816; --surface: #22201d; --ink: #ece8df; --muted: #a09a8d;
      --line: #37342e; --accent: #e0714f; --accent-ink: #1a1210; --ok: #7fbf8f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); display: grid; grid-template-columns: 264px 1fr; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sidebar */
  aside { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 22px 22px 14px; font: 600 22px/1 var(--serif); letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav { flex: 1; overflow: auto; padding: 4px 10px 12px; }
  .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px; text-align: left; }
  .nav-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .nav-item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
  .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nav-item svg { flex: none; opacity: .75; }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 10px; }

  .device { border-top: 1px solid var(--line); padding: 16px 18px 18px; }
  .device-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .device small { display: block; color: var(--muted); margin: 3px 0 12px 17px; font-size: 12.5px; }
  .btn { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; margin-top: 10px; }
  .wifi { display: none; gap: 6px; margin-top: 8px; }
  .wifi.open { display: flex; }
  .wifi input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13px; }
  .wifi button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13px; }
  .notice { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .notice code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* Main */
  main { min-width: 0; overflow: auto; padding: 26px 34px 60px; }
  header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .crumbs { font: 600 26px/1.15 var(--serif); letter-spacing: -.01em; flex: 1; min-width: 200px; }
  .crumbs button { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); }
  .crumbs button:hover { color: var(--ink); }
  .crumbs .sep { color: var(--line); margin: 0 8px; }
  .search { padding: 8px 12px; width: 240px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 26px 22px; }
  .card { border: 0; background: none; padding: 0; text-align: left; display: block; }
  .thumb { aspect-ratio: 3 / 4; background: var(--page); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; display: grid; place-items: center; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover .thumb { transform: translateY(-3px); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .thumb.folder { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: none; border: 1px solid var(--line); color: var(--accent); }
  .thumb.empty { color: #b9b2a3; }
  .card h3 { margin: 11px 0 1px; font: 600 15px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .empty-state { color: var(--muted); padding: 60px 0; text-align: center; font: 17px var(--serif); }
  .source { color: var(--muted); font-size: 12.5px; margin: -12px 0 20px; }
  .source[hidden] { display: none; }

  /* Viewer */
  dialog { border: 0; padding: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: var(--paper); }
  .viewer-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .viewer-bar h2 { margin: 0; font: 600 19px var(--serif); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-bar .meta { color: var(--muted); font-size: 13px; }
  .pill { padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); text-decoration: none; color: inherit; font-size: 13.5px; }
  .pages { max-width: 900px; margin: 0 auto; padding: 28px 22px 80px; display: grid; gap: 26px; }
  .pages figure { margin: 0; }
  .pages img { width: 100%; display: block; border-radius: 4px; box-shadow: var(--shadow); background: var(--page); }
  .pages figcaption { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 7px; }
  .pages figcaption a { color: inherit; }
  .pages iframe { width: 100%; height: 82vh; border: 0; border-radius: 4px; box-shadow: var(--shadow); background: var(--page); }
  .pages .note { color: var(--muted); font-size: 13.5px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s ease; pointer-events: none; font-size: 14px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } main { padding: 18px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside>
  <div class="brand">open<span>marker</span></div>
  <nav id="nav" aria-label="Folders"></nav>
  <div class="device">
    <div class="device-row"><span class="dot" id="dot"></span><span id="conn">Looking for tablet…</span></div>
    <small id="last">&nbsp;</small>
    <button class="btn primary" id="sync" disabled>Sync now</button>
    <div class="notice" id="notice" hidden></div>
    <button class="linkish" id="wifi-toggle">Wi-Fi address</button>
    <form class="wifi" id="wifi">
      <input id="wifi-host" placeholder="e.g. 192.168.1.50" aria-label="Tablet Wi-Fi address" autocomplete="off">
      <button>Save</button>
    </form>
  </div>
</aside>

<main>
  <header>
    <div class="crumbs" id="crumbs"></div>
    <input class="search" id="search" type="search" placeholder="Search by name" aria-label="Search by name">
  </header>
  <div class="source" id="source"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="viewer">
  <div class="viewer-bar">
    <button class="pill" id="close">← Library</button>
    <h2 id="v-title"></h2>
    <span class="meta" id="v-meta"></span>
    <a class="pill" id="v-pdf" hidden target="_blank" rel="noopener">Open PDF</a>
  </div>
  <div class="pages" id="pages"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const ICON = {
  folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>',
  home: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
};
const state = { items: [], byId: new Map(), folder: "", query: "", status: null };

const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
const api = async (path, body) => {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
};
const toast = message => {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => $("toast").classList.remove("show"), 3200);
};
const ago = iso => {
  if (!iso) return "";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 1440) return `${Math.round(mins / 60)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
};
const children = parent => state.items.filter(i => i.parent === parent);
const sorted = list => [...list].sort((a, b) => (b.folder - a.folder) || a.name.localeCompare(b.name, undefined, { numeric: true }));

function renderNav() {
  const nav = $("nav");
  nav.replaceChildren();
  const add = (id, label, icon, depth, count) => {
    const button = el("button", { className: "nav-item", onclick: () => go(id) });
    button.style.paddingLeft = `${10 + depth * 16}px`;
    button.setAttribute("aria-current", String(state.folder === id && !state.query));
    button.insertAdjacentHTML("beforeend", icon);
    button.append(el("span", { textContent: label }), el("span", { className: "count", textContent: count || "" }));
    nav.append(button);
  };
  const docCount = id => children(id).filter(i => !i.folder).length;
  add("", "My files", ICON.home, 0, docCount(""));
  const walk = (parent, depth) => sorted(children(parent)).filter(i => i.folder).forEach(f => {
    add(f.id, f.name, ICON.folder, depth, docCount(f.id));
    walk(f.id, depth + 1);
  });
  walk("", 1);
  nav.append(el("div", { className: "nav-sep" }));
  add("trash", "Trash", ICON.trash, 0, children("trash").length);
}

function renderCrumbs() {
  const crumbs = $("crumbs");
  crumbs.replaceChildren();
  if (state.query) { crumbs.textContent = `Results for “${state.query}”`; return; }
  const trail = [];
  for (let id = state.folder; id && state.byId.has(id); id = state.byId.get(id).parent) trail.unshift(state.byId.get(id));
  const rootLabel = state.folder === "trash" || trail[0]?.parent === "trash" ? ["trash", "Trash"] : ["", "My files"];
  const parts = [rootLabel, ...trail.map(f => [f.id, f.name])];
  parts.forEach(([id, name], index) => {
    if (index) crumbs.append(el("span", { className: "sep", textContent: "/" }));
    crumbs.append(index === parts.length - 1 ? el("span", { textContent: name }) : el("button", { textContent: name, onclick: () => go(id) }));
  });
}

function card(item) {
  const thumb = el("div", { className: "thumb" });
  if (item.folder) {
    thumb.classList.add("folder");
    thumb.innerHTML = ICON.folder.replace(/width="16" height="16"/, 'width="54" height="54"').replace('stroke-width="2"', 'stroke-width="1.3"');
  } else if (item.thumb) {
    thumb.append(el("img", { src: item.thumb, alt: "", loading: "lazy" }));
  } else {
    thumb.classList.add("empty");
    thumb.textContent = (item.type || "file").toUpperCase();
  }
  const detail = item.folder
    ? `${children(item.id).length} item${children(item.id).length === 1 ? "" : "s"}`
    : `${item.pages.length} page${item.pages.length === 1 ? "" : "s"} · ${ago(item.modified)}`;
  return el("button", { className: "card", onclick: () => item.folder ? go(item.id) : openDoc(item) },
    thumb, el("h3", { textContent: item.name, title: item.name }), el("p", { textContent: detail }));
}

function renderGrid() {
  const grid = $("grid");
  const query = state.query.toLowerCase();
  const list = query ? state.items.filter(i => i.name.toLowerCase().includes(query)) : children(state.folder);
  grid.replaceChildren(...sorted(list).map(card));
  if (!list.length) grid.append(el("div", { className: "empty-state", textContent: query ? "Nothing matches that search." : "Nothing here yet." }));
  grid.style.display = list.length ? "" : "block";
}

function go(folder) {
  state.query = "";
  $("search").value = "";
  if (location.hash.slice(1) === folder) route(); else location.hash = folder;
}
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const doc = hash.startsWith("doc/") ? state.byId.get(hash.slice(4)) : null;
  if (doc && !doc.folder) {
    state.folder = doc.parent;
    renderAll();
    showDoc(doc);
    return;
  }
  if ($("viewer").open) $("viewer").close();
  state.folder = hash === "trash" || state.byId.get(hash)?.folder ? hash : "";
  renderAll();
}
const openDoc = item => { location.hash = `doc/${item.id}`; };
function renderAll() { renderNav(); renderCrumbs(); renderGrid(); }

function showDoc(item) {
  $("v-title").textContent = item.name;
  $("v-meta").textContent = `${item.pages.length} page${item.pages.length === 1 ? "" : "s"} · edited ${ago(item.modified)}`;
  const pdfLink = $("v-pdf");
  pdfLink.hidden = !item.has_pdf;
  if (item.has_pdf) pdfLink.href = `/api/pdf/${item.id}.pdf`;
  const pages = $("pages");
  pages.replaceChildren();
  const figure = (pageId, number) => {
    const src = `/api/page/${item.id}/${pageId}.svg`;
    return el("figure", {},
      el("img", { src, alt: `Page ${number}`, loading: "lazy" }),
      el("figcaption", {}, el("span", { textContent: `Page ${number}` }), el("a", { href: src, download: `${item.name} - page ${number}.svg`, textContent: "Download SVG" })));
  };
  if (item.type === "notebook") {
    item.pages.forEach((id, index) => pages.append(figure(id, index + 1)));
  } else {
    if (item.inked.length) {
      pages.append(el("p", { className: "note", textContent: `Your ink on ${item.inked.length} page${item.inked.length === 1 ? "" : "s"}, shown without the document behind it:` }));
      item.inked.forEach(id => pages.append(figure(id, item.pages.indexOf(id) + 1)));
    }
    if (item.has_pdf) pages.append(el("iframe", { src: `/api/pdf/${item.id}.pdf`, title: item.name }));
    else pages.append(el("p", { className: "note", textContent: "This document type can't be previewed yet." }));
  }
  $("viewer").showModal();
  $("viewer").scrollTop = 0;
}

async function loadLibrary() {
  const data = await api("/api/library");
  state.items = data.items;
  state.byId = new Map(data.items.map(i => [i.id, i]));
  $("source").textContent = data.source === "mirror" ? "" : "Showing the desktop app's cache. Sync the tablet to see its current contents.";
  $("source").hidden = data.source === "mirror";
  route();
}

async function loadStatus() {
  const s = state.status = await api("/api/status");
  $("dot").classList.toggle("on", s.connected);
  $("conn").textContent = s.connected ? `Tablet connected · ${s.via}` : "Tablet not connected";
  $("last").textContent = s.last_sync ? `Last synced ${ago(s.last_sync)}` : "Not synced yet";
  $("sync").disabled = !s.connected || !s.set_up || $("sync").dataset.busy === "1";
  if (document.activeElement !== $("wifi-host")) $("wifi-host").value = s.wifi_host;
  const notice = $("notice");
  notice.hidden = s.set_up;
  if (!s.set_up) notice.innerHTML = "One-time step: run <code>python -m openmarker setup</code> in a terminal to authorise this computer.";
}

$("sync").onclick = async () => {
  const button = $("sync");
  button.dataset.busy = "1"; button.disabled = true; button.textContent = "Syncing…";
  const result = await api("/api/sync", {}).catch(() => ({ ok: false, error: "failed" }));
  button.dataset.busy = ""; button.textContent = "Sync now";
  if (result.ok) {
    toast(result.fetched ? `Synced over ${result.via}: ${result.fetched} file${result.fetched === 1 ? "" : "s"} updated` : "Already up to date");
    await loadLibrary();
  } else {
    toast({ not_connected: "Tablet not reachable", needs_setup: "Run setup first", busy: "A sync is already running" }[result.error] || "Sync failed");
  }
  loadStatus();
};
$("wifi-toggle").onclick = () => $("wifi").classList.toggle("open");
$("wifi").onsubmit = async event => {
  event.preventDefault();
  const result = await api("/api/config", { wifi_host: $("wifi-host").value });
  toast(result.ok ? "Wi-Fi address saved" : "That address doesn't look right");
  loadStatus();
};
$("search").oninput = event => { state.query = event.target.value.trim(); renderAll(); };
$("close").onclick = () => $("viewer").close();
$("viewer").addEventListener("close", () => { if (location.hash.startsWith("#doc/")) location.hash = state.folder; });
addEventListener("hashchange", route);

loadLibrary();
loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
