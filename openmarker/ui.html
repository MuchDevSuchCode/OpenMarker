<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMarker</title>
<style>
  :root {
    --paper: #f3f0e8; --surface: #fbfaf6; --ink: #1d1c1a; --muted: #6f6a60;
    --line: #dcd6c8; --accent: #b4472e; --accent-ink: #fff; --ok: #3d7a4e; --page: #fdfcf9;
    --shadow: 0 1px 2px rgba(40,30,10,.08), 0 6px 18px rgba(40,30,10,.07);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #191816; --surface: #22201d; --ink: #ece8df; --muted: #a09a8d;
      --line: #37342e; --accent: #e0714f; --accent-ink: #1a1210; --ok: #7fbf8f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); display: grid; grid-template-columns: 264px 1fr; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sidebar */
  aside { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 22px 22px 14px; font: 600 22px/1 var(--serif); letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav { flex: 1; overflow: auto; padding: 4px 10px 12px; }
  .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px; text-align: left; }
  .nav-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .nav-item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
  .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nav-item svg { flex: none; opacity: .75; }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 10px; }

  .device { border-top: 1px solid var(--line); padding: 16px 18px 18px; }
  .device-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .device small { display: block; color: var(--muted); margin: 3px 0 12px 17px; font-size: 12.5px; }
  .btn { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; margin-top: 10px; }
  .wifi { display: none; gap: 6px; margin-top: 8px; }
  .wifi.open { display: flex; }
  .wifi input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13px; }
  .wifi button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 13px; }
  .notice { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .notice code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* Main */
  main { min-width: 0; overflow: auto; padding: 26px 34px 60px; }
  header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .crumbs { font: 600 26px/1.15 var(--serif); letter-spacing: -.01em; flex: 1; min-width: 200px; }
  .crumbs button { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); }
  .crumbs button:hover { color: var(--ink); }
  .crumbs .sep { color: var(--line); margin: 0 8px; }
  .search { padding: 8px 12px; width: 260px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 26px 22px; }
  .card { border: 0; background: none; padding: 0; text-align: left; display: block; }
  .thumb { aspect-ratio: 3 / 4; background: var(--page); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; display: grid; place-items: center; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover .thumb { transform: translateY(-3px); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .thumb.folder { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: none; border: 1px solid var(--line); color: var(--accent); }
  .thumb.empty { color: #b9b2a3; }
  .card h3 { margin: 11px 0 1px; font: 600 15px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .empty-state { color: var(--muted); padding: 60px 0; text-align: center; font: 17px var(--serif); }
  .source { color: var(--muted); font-size: 12.5px; margin: -12px 0 20px; }
  .source[hidden] { display: none; }

  /* Viewer */
  dialog { border: 0; padding: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: var(--paper); }
  .viewer-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .viewer-bar h2 { margin: 0; font: 600 19px var(--serif); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-bar .meta { color: var(--muted); font-size: 13px; }
  .pill { padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); text-decoration: none; color: inherit; font-size: 13.5px; white-space: nowrap; }
  .pill:disabled { opacity: .5; cursor: default; }
  .pages { max-width: 900px; width: 100%; margin: 0 auto; padding: 28px 22px 80px; display: grid; gap: 26px; }
  .pages figure { margin: 0; }
  .pages img { width: 100%; display: block; border-radius: 4px; box-shadow: var(--shadow); background: var(--page); }
  .pages figcaption { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 7px; }
  .pages figcaption a { color: inherit; }
  .pages iframe { width: 100%; height: 82vh; border: 0; border-radius: 4px; box-shadow: var(--shadow); background: var(--page); }
  .pages .note { color: var(--muted); font-size: 13.5px; }

  .actions { display: flex; gap: 8px; align-items: center; }
  .pill { cursor: pointer; }
  .pill.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .danger { color: var(--accent); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 210px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: none; }
  .menu.open .menu-list { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
  .menu-list button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .card { position: relative; }
  .card .card { width: 100%; }
  .more { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); opacity: 0; line-height: 1; font-weight: 700; }
  .card:hover .more, .more:focus-visible { opacity: 1; }
  .section { grid-column: 1 / -1; font: 600 13px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .snippet { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .drop main { outline: 3px dashed var(--accent); outline-offset: -14px; }
  .stack { position: relative; border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; background: #fff; }
  .pages .stack img { box-shadow: none; border-radius: 0; background: none; }
  .pages .stack img + img { position: absolute; inset: 0; height: 100%; }
  .viewer-body { display: grid; grid-template-columns: 1fr; }
  .text-bar { display: none; gap: 8px; align-items: center; justify-content: flex-end; }
  .text-mode .text-bar { display: flex; }
  .text-bar span { margin-right: auto; color: var(--muted); font-size: 13.5px; }
  .pages.text-mode { max-width: 1320px; }
  .text-mode figure { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 24px; align-items: start; }
  .text-mode figcaption { grid-column: 1; }
  .ptext { display: none; grid-column: 2; grid-row: 1; white-space: pre-wrap; font: 16px/1.6 var(--serif); padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px; user-select: text; }
  .ptext:empty::before { content: "No text found on this page."; color: var(--muted); font-style: italic; }
  .text-mode .ptext { display: block; }
  @media (max-width: 900px) { .text-mode figure { grid-template-columns: 1fr; } .ptext { grid-column: 1; grid-row: auto; } }
  .viewer-body.with-history { grid-template-columns: 1fr 280px; }
  .history { display: none; border-left: 1px solid var(--line); padding: 22px 18px; position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow: auto; }
  .with-history .history { display: block; }
  .history h3 { margin: 0 0 4px; font: 600 17px var(--serif); }
  .history p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .version { display: block; width: 100%; text-align: left; padding: 9px 11px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .version[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .version small { display: block; color: var(--muted); }
  dialog.sheet { width: min(420px, 92vw); height: auto; border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--surface); box-shadow: var(--shadow); }
  dialog.sheet::backdrop { background: rgba(20, 16, 10, .45); }
  .sheet h3 { margin: 0 0 14px; font: 600 19px var(--serif); }
  .sheet input, .sheet select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  .sheet .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog.sheet.wide { width: min(860px, 94vw); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .compare figure { margin: 0; }
  .compare figcaption { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .compare .frame { height: 300px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: repeating-conic-gradient(#d9d4c8 0% 25%, #efece4 0% 50%) 0 0 / 18px 18px; }
  .compare .frame.page { background: #fff; }
  .compare img { max-width: 100%; max-height: 300px; display: block; }
  .field { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; margin-top: 10px; font-size: 14px; }
  .field input[type=range] { padding: 0; accent-color: var(--accent); }
  .busy { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: color-mix(in srgb, var(--paper) 78%, transparent); font: 600 18px var(--serif); }
  .busy.on { display: grid; }
  .toast { position: fixed; z-index: 60; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s ease; pointer-events: none; font-size: 14px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } main { padding: 18px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  #nav-toggle { display: none; }
  /* Shared controls and responsive library/viewer layouts. */
  [hidden] { display: none !important; }
  select { font: inherit; color: inherit; }
  button, .pill { min-height: 40px; }
  button:disabled { cursor: not-allowed; }
  button:hover:not(:disabled), a.pill:hover { filter: brightness(.96); }
  .actions { flex-wrap: wrap; min-width: 0; }
  .search { width: clamp(180px, 22vw, 280px); }
  .crumbs { overflow-wrap: anywhere; }
  .nav-item span:not(.count) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .empty-state { grid-column: 1 / -1; }
  .more { opacity: 1; width: 40px; height: 40px; }
  .card:focus-within .thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
  .viewer-bar { flex-wrap: wrap; gap: 8px; }
  .viewer-bar h2 { min-width: 120px; }
  .viewer-bar .meta { flex-basis: 100%; order: 2; }
  .viewer-body, .pages { min-width: 0; }
  .text-bar { flex-wrap: wrap; }
  .toast { max-width: calc(100vw - 32px); border-radius: 10px; width: max-content; }
  .sheet { max-height: calc(100dvh - 32px); overflow: auto; }
  .sheet input:invalid { box-shadow: none; }
  @media (max-width: 1100px) { header { align-items: flex-start; } .actions { flex-basis: 100%; } .search { flex: 1; } }
  @media (max-width: 720px) {
    html, body { height: auto; min-height: 100%; }
    body { display: block; }
    aside { display: flex; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 14px 18px; display: flex; align-items: center; }
    #nav-toggle { display: block; margin-left: auto; font: 13px var(--sans); }
    aside:not(.expanded) nav, aside:not(.expanded) .device { display: none; }
    nav { max-height: 180px; padding: 0 8px 8px; }
    .device { padding: 12px 18px; }
    .device small { margin-bottom: 8px; }
    .device .btn { width: auto; min-width: 120px; }
    main { padding: 22px 18px 40px; overflow: visible; }
    header { gap: 14px; }
    .crumbs { font-size: 24px; min-width: 0; }
    .actions { gap: 8px; width: 100%; }
    .search { width: 100%; flex: 1 0 100%; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
    .viewer-bar { padding: 12px; }
    .viewer-bar h2 { order: -1; flex-basis: 100%; }
    .viewer-body.with-history { grid-template-columns: minmax(0, 1fr); }
    .with-history .history { grid-row: 1; position: static; max-height: 260px; border-left: 0; border-bottom: 1px solid var(--line); }
    .pages { padding: 18px 12px 40px; }
    .menu-list { min-width: 190px; }
  }

</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">Open<span>Marker</span><button id="nav-toggle" class="pill" aria-expanded="false" aria-controls="nav device-panel">Library &amp; tablet</button></div>
  <nav id="nav" aria-label="Folders"></nav>
  <div class="device" id="device-panel">
    <div class="device-row"><span class="dot" id="dot"></span><span id="conn">Looking for tablet…</span></div>
    <small id="last">&nbsp;</small>
    <button class="btn primary" id="sync" disabled>Sync now</button>
    <div class="notice" id="notice" hidden></div>
    <label class="check"><input type="checkbox" id="auto"> Sync automatically</label>
    <button class="linkish" id="wifi-toggle">Wi-Fi address</button>
    <form class="wifi" id="wifi">
      <input id="wifi-host" placeholder="e.g. 192.168.1.50" aria-label="Tablet Wi-Fi address" autocomplete="off">
      <button>Save</button>
    </form>
  </div>
</aside>

<main>
  <header>
    <div class="crumbs" id="crumbs"></div>
    <div class="actions">
      <input class="search" id="search" type="search" placeholder="Search names and handwriting" aria-label="Search names and handwriting">
      <button class="pill" id="new-folder">New folder</button>
      <div class="menu" id="send-menu">
        <button class="pill accent" id="send" aria-haspopup="true">Send to tablet</button>
        <div class="menu-list">
          <button id="send-file">PDF or EPUB file…</button>
          <button id="send-image">Picture…</button>
          <button id="send-url">Web page…</button>
          <button id="send-agenda">Today's agenda page</button>
        </div>
      </div>
      <input type="file" id="file" accept=".pdf,.epub" multiple hidden>
      <input type="file" id="image-file" accept="image/*" hidden>
    </div>
  </header>
  <div class="source" id="source"></div>
  <div class="grid" id="grid" aria-label="Library items"></div>
</main>

<dialog id="viewer" aria-labelledby="v-title">
  <div class="viewer-bar">
    <button class="pill" id="close">← Library</button>
    <h2 id="v-title"></h2>
    <span class="meta" id="v-meta"></span>
    <a class="pill" id="v-export">Export PDF</a>
    <button class="pill" id="v-text" aria-pressed="false">Convert to text</button>
    <button class="pill" id="v-history">History</button>
    <div class="menu" id="v-menu">
      <button class="pill" id="v-more" aria-haspopup="true" aria-label="More actions">⋯</button>
      <div class="menu-list">
        <button id="v-rename">Rename…</button>
        <button id="v-move">Move…</button>
        <button id="v-trash" class="danger">Move to trash</button>
      </div>
    </div>
  </div>
  <div class="viewer-body" id="v-body">
    <div class="pages" id="pages"></div>
    <div class="history">
      <h3>History</h3>
      <p>A version is kept each time a sync finds changes.</p>
      <div id="versions"></div>
      <button class="btn" id="restore" hidden>Restore as a copy</button>
    </div>
  </div>
</dialog>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title" aria-describedby="sheet-text">
  <form method="dialog" id="sheet-form">
    <h3 id="sheet-title"></h3>
    <p id="sheet-text" hidden></p>
    <input id="sheet-input" autocomplete="off" hidden>
    <select id="sheet-select" hidden></select>
    <div class="row">
      <button class="pill" value="cancel" formnovalidate>Cancel</button>
      <button class="pill accent" value="ok" id="sheet-ok">OK</button>
    </div>
  </form>
</dialog>
<dialog class="sheet wide" id="image-sheet">
  <form method="dialog">
    <h3>Send a picture</h3>
    <p>The background is made white so the picture shows cleanly on the tablet's screen. It is sent as a one-page PDF you can write on.</p>
    <div class="compare">
      <figure><figcaption>Original</figcaption><div class="frame"><img id="image-before" alt="Original picture"></div></figure>
      <figure><figcaption id="image-caption">On the tablet</figcaption><div class="frame page"><img id="image-after" alt="Picture as it will be sent"></div></figure>
    </div>
    <label class="field">Treatment
      <select id="image-mode">
        <option value="auto">Automatic</option>
        <option value="ink">Trace into real pen strokes (for drawings)</option>
        <option value="subject" id="image-subject">Cut out the subject (AI, on this computer)</option>
        <option value="cutout">Remove a plain backdrop</option>
        <option value="paper">Flatten a photo of paper or a whiteboard</option>
        <option value="keep">Leave as it is</option>
      </select>
    </label>
    <label class="field" id="image-tolerance-row">Strength
      <input type="range" id="image-tolerance" min="5" max="150" value="40">
    </label>
    <label class="field">Name <input id="image-name" autocomplete="off" required></label>
    <div class="row">
      <button class="pill" value="cancel" formnovalidate>Cancel</button>
      <button class="pill accent" value="ok" id="image-send">Send to tablet</button>
    </div>
  </form>
</dialog>
<div class="busy" id="busy" role="status" aria-live="polite">Updating the tablet…</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
$("nav-toggle").onclick = () => { const open = $("sidebar").classList.toggle("expanded"); $("nav-toggle").setAttribute("aria-expanded", String(open)); };
const ICON = {
  folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>',
  home: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
};
const state = { items: [], byId: new Map(), folder: "", query: "", status: null, hits: [], doc: null, version: "" };

const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
const api = async (path, body) => {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "The app could not complete that request.");
  return data;
};
// Run something that changes the tablet: blocks the page, reports the outcome, reloads.
async function act(message, request, done) {
  $("busy").textContent = message;
  $("busy").classList.add("on");
  let result;
  try { result = await request(); } catch { result = { ok: false, error: "Something went wrong talking to the app." }; }

// A small modal: resolves to the entered or selected value, true for a plain confirm, or null if cancelled.
function ask({ title, text, value, options, ok = "OK" }) {

const ago = iso => {

  if (mins < 60) return `${mins} min ago`;

function renderNav() {

async function sendFiles(files) {
  const wanted = [...files].filter(f => /\.(pdf|epub)$/i.test(f.name));
  if (!wanted.length) return toast("Only PDF and EPUB files can be sent.");
  if (!state.status?.connected || !state.status?.set_up) return toast("Connect and set up the tablet before sending files.");
  if (wanted.some(f => f.size > 500 * 1024 * 1024 || !f.size)) return toast("Choose non-empty files smaller than 500 MB.");
  const parent = currentFolder();
  await act(`Sending ${wanted.length === 1 ? wanted[0].name : `${wanted.length} files`} to the tablet…`, async () => {
    let last = { ok: true };
    for (const file of wanted) {
      last = await (await fetch(`/api/upload?name=${encodeURIComponent(file.name)}&parent=${parent}`, { method: "POST", body: file })).json();
      if (!last.ok) break;
    }
    return last;
  }, "Sent to the tablet");
}

addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("drop"); } });
addEventListener("dragover", event => event.preventDefault());
addEventListener("drop", event => {
  event.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("drop");
  const dropped = [...(event.dataTransfer?.files || [])];
  const image = dropped.find(f => f.type.startsWith("image/"));
  if (image && !$("send").disabled) openImage(image);
  else if (dropped.length) sendFiles(dropped);
});

// Viewer actions
const viewed = () => state.byId.get(state.doc);
$("v-history").onclick = showHistory;
$("v-text").onclick = () => {
  if (state.version) { state.version = ""; $("v-body").classList.remove("with-history"); state.textMode = true; return showDoc(viewed()); }
  setTextMode(!state.textMode);
};
$("v-rename").onclick = async () => { if (await rename(viewed())) route(); };
$("v-move").onclick = () => move(viewed());
$("v-trash").onclick = async () => { if (await trash(viewed())) $("viewer").close(); };
$("restore").onclick = async () => {
  const item = viewed();
  const sure = await ask({ title: "Restore this version?", text: "It is added to the tablet as a new copy. The current document is not changed.", ok: "Restore as a copy" });
  if (sure) act("Restoring a copy to the tablet…", () => api("/api/restore", { id: item.id, snapshot: state.version }), "Restored as a copy");
};
$("auto").onchange = async event => {
  const checked = event.target.checked;
  try { const result = await api("/api/config", { auto_sync: checked }); if (!result.ok) throw new Error(result.error); }
  catch (error) { $("auto").checked = !checked; toast(error.message); }
};
$("close").onclick = () => $("viewer").close();
$("viewer").addEventListener("close", () => { if (location.hash.startsWith("#doc/")) location.hash = state.folder; });
addEventListener("hashchange", route);

loadLibrary();
loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
